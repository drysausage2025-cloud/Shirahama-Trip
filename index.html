<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123f52"><title>白浜旅行しおり 2026</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#18323d;background:#f4f8f8}*{box-sizing:border-box}body{margin:0}header{background:#123f52;color:white;padding:26px 18px 22px}main{max-width:720px;margin:auto;padding:16px}h1{font-size:24px;margin:4px 0}h2{font-size:18px;margin:22px 0 12px}p{line-height:1.6}.sub{opacity:.8;font-size:13px}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1}.tabs button.active{background:#123f52;color:white}button,.link{border:1px solid #ccd9dc;border-radius:10px;background:white;color:#123f52;padding:10px 12px;font-weight:600;text-decoration:none;cursor:pointer;font-size:14px}.card{background:white;border:1px solid #e0e8e9;border-radius:14px;padding:15px;margin:10px 0;box-shadow:0 2px 7px #153d4b09}.top{display:flex;justify-content:space-between;gap:10px;align-items:start}.time{font-size:13px;color:#526a75}.name{font-weight:700;margin-top:4px}.tag{font-size:12px;border-radius:6px;padding:3px 7px;background:#e4f0f4;color:#1b5c75}.tag.食事{background:#fce8e6;color:#a43c31}.tag.買物{background:#fff0d6;color:#915700}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.links a{font-size:13px;padding:8px 10px}.note{font-size:12px;color:#687d85}.check{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid #e8eded}.check input{width:20px;height:20px}footer{padding:20px;text-align:center;font-size:12px;color:#647880}</style></head><body>
<header><div style="max-width:720px;margin:auto"><div class="sub">4人で楽しむ旅のしおり｜2026年11月21–22日</div><h1>🌊 白浜・田辺 旅行</h1><div class="sub">神戸発・1泊2日　｜　予定を変えずにアプリ化</div></div></header>
<main><div class="tabs"><button id="d21" onclick="changeDay('21')">11/21 土曜</button><button id="d22" onclick="changeDay('22')">11/22 日曜</button></div>
<h2>📍 旅のタイムライン</h2><div id="timeline"></div>
<h2>🍽️ 食事候補</h2><div id="shops"></div>
<h2>🛍️ お土産チェック <small id="count"></small></h2><div class="card" id="checks"></div>
<p class="note">地図は検索リンクです。食べログは個別店舗ページへのリンクを優先しています。営業時間、予約、道路状況、白熊カフェの所在地と梅メニューは出発前に要確認。チェックはこの端末のブラウザ内に保存され、他の人とは同期しません。</p>
</main><footer>白浜旅行しおり・無料Webアプリ試作版</footer>
<script>const DATA={"stops": [["21", "08:00", "出発｜学園都市駅", "移動", "学園都市駅 神戸市"], ["21", "10:45–12:15", "紀三井寺", "観光", "紀三井寺 和歌山市"], ["21", "12:35–13:25", "海南で昼食", "食事", "海鮮食堂つなや 海南店"], ["21", "15:15–17:00", "天神崎（水鏡16:15–16:45）", "観光", "天神崎 田辺市"], ["21", "18:00–18:50", "三段壁ナイトウォーク", "観光", "三段壁洞窟 白浜町"], ["21", "19:15", "SEAMORE RESIDENCE", "宿泊", "SEAMORE RESIDENCE 白浜"], ["21", "20:00", "夕食（予約済み）", "食事", "白浜町"], ["22", "08:45–09:15", "Kagerou Café", "食事", "Kagerou Cafe 白浜"], ["22", "10:00–10:20", "プラムガーデンオカハタ", "買物", "プラムガーデンオカハタ 田辺"], ["22", "10:20–10:40", "鈴屋菓子店 本店", "買物", "鈴屋菓子店 本店 田辺"], ["22", "10:40–11:00", "たな梅本店", "買物", "たな梅本店 田辺"], ["22", "11:00–12:00", "昼食（3候補）", "食事", "田辺市"], ["22", "12:30–13:30", "奇絶峡", "観光", "奇絶峡 田辺市"], ["22", "15:00–15:45", "白崎海洋公園", "観光", "白崎海洋公園 由良町"], ["22", "16:45–17:30", "ありだっこ（必須）", "買物", "ありだっこ 有田川町"], ["22", "夕方以降", "和歌山ラーメン", "食事", "中華そば 楠本屋 海南"]], "shops": {"21": [["海鮮食堂つなや 海南店", "海鮮料理"], ["信濃路 海南店", "和食"], ["魚盛水産（海南サクアス）", "魚料理"], ["中華そば 楠本屋", "和歌山ラーメン"]], "22": [["食堂ハナビー", "スパイスカレー"], ["魚かつ よし平", "まぐろのレアかつ"], ["白熊カフェ", "梅メニューの詳細・店舗所在地は未確認"], ["井出商店", "和歌山ラーメン"], ["和dining清乃 本店", "日曜夜営業要確認"]]}};let day='21';const gifts=['牛蒡巻','本なれ寿司','あせ寿司','デラックスケーキ','生かげろう'];function map(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}const TABELOG={
'海鮮食堂つなや 海南店':'https://tabelog.com/wakayama/A3002/A300201/30010574/',
'中華そば 楠本屋':'https://tabelog.com/wakayama/A3002/A300201/30000265/',
'食堂ハナビー':'https://tabelog.com/wakayama/A3004/A300402/30009445/',
'魚かつ よし平':'https://tabelog.com/wakayama/A3004/A300402/30010999/',
'井出商店':'https://tabelog.com/wakayama/A3001/A300101/30000031/',
'和dining清乃 本店':'https://tabelog.com/wakayama/A3002/A300202/30010371/',
'信濃路 海南店':'https://tabelog.com/rstLst/?sw=%E4%BF%A1%E6%BF%83%E8%B7%AF%20%E6%B5%B7%E5%8D%97%E5%BA%97',
'魚盛水産（海南サクアス）':'https://tabelog.com/rstLst/?sw=%E9%AD%9A%E7%9B%9B%E6%B0%B4%E7%94%A3%EF%BC%88%E6%B5%B7%E5%8D%97%E3%82%B5%E3%82%AF%E3%82%A2%E3%82%B9%EF%BC%89'
};function tabelog(q){return TABELOG[q]||'https://tabelog.com/rstLst/?sw='+encodeURIComponent(q+' 和歌山')}function changeDay(d){day=d;render()}function render(){document.getElementById('d21').classList.toggle('active',day==='21');document.getElementById('d22').classList.toggle('active',day==='22');document.getElementById('timeline').innerHTML=DATA.stops.filter(x=>x[0]===day).map(x=>`<div class="card"><div class="top"><div><div class="time">${x[1]}</div><div class="name">${x[2]}</div></div><span class="tag ${x[3]}">${x[3]}</span></div><div class="links"><a class="link" target="_blank" rel="noopener" href="${map(x[4])}">📍 Googleマップ</a></div></div>`).join('');document.getElementById('shops').innerHTML=DATA.shops[day].map(x=>`<div class="card"><div class="name">${x[0]}</div><div class="time">${x[1]}</div><div class="links"><a class="link" target="_blank" rel="noopener" href="${map(x[0]+' 和歌山')}">地図</a><a class="link" target="_blank" rel="noopener" href="${tabelog(x[0])}">${TABELOG[x[0]]&&!TABELOG[x[0]].includes("rstLst")?"食べログ（店舗）":"食べログ検索"}</a></div></div>`).join('');renderChecks()}function renderChecks(){let saved=[];try{saved=JSON.parse(localStorage.getItem('shirahama-gifts')||'[]')}catch(e){}document.getElementById('count').textContent=saved.length+'/5';document.getElementById('checks').innerHTML=gifts.map((x,i)=>`<label class="check"><input type="checkbox" data-gift="${i}" ${saved.includes(x)?'checked':''}>${x}</label>`).join('');document.querySelectorAll('[data-gift]').forEach(el=>el.addEventListener('change',()=>{let values=[...document.querySelectorAll('[data-gift]:checked')].map(y=>gifts[+y.dataset.gift]);try{localStorage.setItem('shirahama-gifts',JSON.stringify(values))}catch(e){}document.getElementById('count').textContent=values.length+'/5'}))}render();</script></body></html>
